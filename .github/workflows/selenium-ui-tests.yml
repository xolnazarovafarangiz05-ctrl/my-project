name: L8 Selenium UI Tests

on:
  push:
    branches: [ main ]

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -v --junitxml=reports/ui_results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-junit-report
          path: reports/ui_results.xml
